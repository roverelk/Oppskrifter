version: '3.8'

services:
  backend:
    build: ./backend
    environment:
      - RECIPES_DIR=/app/recipes
      - PORT=${BACKEND_PORT:-8000}
    volumes:
      - ./recipes:/app/recipes
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

# The recipes directory stays on the host (see the bind mount above) so you can
# edit it directly, e.g. on a NAS.
